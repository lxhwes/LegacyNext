name: CI

on:
  # Branches only: a v* tag runs this same gate through release.yml.
  push:
    branches: ["**"]
  pull_request:
  # release.yml calls this file, so a tag passes the gate CI enforces, not a copy of it.
  workflow_call:

# Fork PRs run this too; nothing here needs to write.
permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # WoW runs Lua 5.1, so the tests do too.
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.1"

      - uses: leafo/gh-actions-luarocks@v5

      - name: Install tools
        run: |
          luarocks install --no-doc luacheck
          luarocks install --no-doc busted

      - name: Lint
        run: luacheck LegacyNext spec

      - name: Test
        run: busted
