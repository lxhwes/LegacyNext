name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # WoW runs Lua 5.1, so the tests do too.
      - uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: "5.1"

      - uses: leafo/gh-actions-luarocks@v5

      - name: Install tools
        run: |
          luarocks install --no-doc luacheck
          luarocks install --no-doc busted

      - name: Lint
        run: luacheck LegacyNext spec

      - name: Test
        run: busted
